name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# Evita duas execuções do mesmo branch/PR rodando (e publicando) em paralelo
# se um push novo chegar antes da anterior terminar.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Gate: typecheck + build do Astro (contra o conteúdo de exemplo, via
  # predev/prebuild — ver package.json) rodam em TODO push/PR. Publicar a
  # imagem depende deste job (ver "needs" abaixo) — um erro aqui nunca
  # publica uma tag nova do brand-engine.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # node:22 vem com npm 10, que resolve os fallbacks wasm32 opcionais
      # (@rolldown/binding-wasm32-wasi, @bruits/satteri-wasm32-wasi -> @emnapi/*)
      # de um jeito que nem sempre bate com o próprio lockfile que ele acabou
      # de gerar (confirmado: "npm install && npm ci" sob npm 10 falha nessa
      # árvore). O lockfile deste repo é gerado com npm 11 — pin aqui pra
      # "npm ci" validar contra a mesma versão que escreveu o lockfile.
      - run: npm install -g npm@11.6.2

      - run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Build (conteúdo de exemplo)
        run: npm run build
        # generate-llms-txt.mjs (rodado via prebuild) exige essas vars — em
        # produção vêm do .env real da instância (ver entrypoint.sh); aqui
        # só precisam de qualquer valor não-vazio pro build de exemplo
        # passar. Mesmos placeholders do .env.example.
        env:
          SITE_NAME: "Nome da Marca"
          SITE_URL: "https://minhamarca.example.com"
          SITE_DESCRIPTION: "Descrição curta da marca (1-2 frases), usada no schema.org Organization e no llms.txt."

      - name: Build da imagem Docker (sem publicar)
        run: docker build --target server -t brand-engine:ci-check .

      # Varre a imagem publicavel por CVEs conhecidos (SO + deps npm que ficam
      # na imagem). Nao-bloqueante de proposito (exit-code: 0): serve pra dar
      # VISIBILIDADE — os vulns high restantes (ver SECURITY-AUDIT.md, Finding 8)
      # vem todos do vite/esbuild que o proprio @tinacms/cli empacota pra buildar
      # o /admin; ja tentamos forcar via `overrides` no package.json e quebra o
      # `npm run tina:build` de verdade (import quebrado, nao so CVE) — so some
      # numa release futura do @tinacms/cli (nao existe hoje: 2.5.6 ja e o
      # "latest" publicado). Travar o publish nisso agora so pararia releases sem
      # correcao disponivel. Quando o Tina publicar algo mais novo, reteste os
      # overrides e troque pra exit-code: '1' pra virar gate de verdade.
      # ignore-unfixed evita ruido de CVE sem patch upstream disponivel.
      - name: Scan de vulnerabilidades da imagem (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: brand-engine:ci-check
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'

  # Publica ghcr.io/<owner>/brand-engine só em push pro main (tag "latest",
  # rastreável por marca via rollback pro sha anterior se precisar) ou numa
  # tag "vX.Y.Z" (tags semver — o mecanismo de update/rollback por marca
  # descrito no README depende de tags fixas existirem de verdade).
  publish:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Nome da imagem (owner em minúsculas — GHCR exige)
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/brand-engine" >> "$GITHUB_OUTPUT"

      - name: Metadados/tags da imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long

      - uses: docker/setup-buildx-action@v3

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: server
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # TEMPLATE_BUILD_ID: identidade única por commit pro carimbo de
          # rebuild do entrypoint.sh — sem isso, "latest"/tags sha (que saem
          # em TODO push pro main, não só em bumps de version) podem não
          # disparar rebuild nenhum contra um volume existente. Ver
          # comentário em entrypoint.sh e Dockerfile.
          build-args: |
            TEMPLATE_BUILD_ID=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
