server {
    # 8080, nao 80: o container roda como usuario nao-root (ver Dockerfile), que
    # nao pode bindar portas <1024. Porta interna — o Traefik roteia pra ca via
    # label loadbalancer.server.port=8080 (ver docker-compose*.yml).
    listen 8080;
    server_name _;
    # Build gerado pelo entrypoint.sh em /app/data (volume persistente), nao
    # em build-time da imagem — ver entrypoint.sh na raiz do repo.
    root /app/data/dist;
    index index.html;

    # Nao expor a versao do nginx no header Server nem na pagina de erro —
    # tira uma dica facil de fingerprinting/CVE-matching pra quem varre a VPS.
    server_tokens off;

    # Headers de seguranca. IMPORTANTE (pegadinha do nginx): um bloco `location`
    # com QUALQUER `add_header` proprio descarta TODOS os `add_header` herdados
    # do nivel `server` — como os dois `location` abaixo ja setam Cache-Control,
    # headers de seguranca postos aqui no server sumiriam neles. Por isso ficam
    # repetidos DENTRO de cada location (via variaveis nao da — add_header nao
    # aceita), mantendo tudo neste unico arquivo que o Dockerfile copia.
    #
    # A CSP entra como Report-Only de proposito: o /admin (SPA do TinaCMS) e uma
    # app React que pode quebrar sob CSP estrita (inline scripts/styles, etc.).
    # Report-Only NAO bloqueia nada — so serve pra validar a policy no browser
    # (DevTools > Console mostra violacoes) antes de promover pra enforce. Passos
    # pra endurecer: 1) navegar o site + /admin com esta policy, 2) ajustar ate
    # zero violacao, 3) trocar "Content-Security-Policy-Report-Only" por
    # "Content-Security-Policy" e, se possivel, remover os 'unsafe-inline'.

    # Assets do build do Astro (nome com hash de conteúdo, ex: /_astro/*) —
    # se o conteúdo mudar, o nome do arquivo muda junto, então dá pra
    # cachear "pra sempre" sem risco de servir versão desatualizada.
    location ^~ /_astro/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # HTML e o resto (robots.txt, sitemap, llms.txt, favicon) não tem hash
    # no nome — muda de conteúdo sem mudar de URL a cada novo deploy. TTL
    # curto: uma CDN/navegador na frente ainda descarrega o servidor em
    # picos de tráfego, mas conteúdo desatualizado por no máximo 5min depois
    # de um deploy. Ajuste max-age pra baixo se 5min for inaceitável, ou pra
    # cima se a marca publica com pouca frequência.
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        try_files $uri $uri/index.html $uri/ =404;
    }

    error_page 404 /404.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml text/xml;
}
