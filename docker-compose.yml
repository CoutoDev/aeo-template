services:
  dev:
    build:
      context: .
      target: dev
    ports:
      - "${DEV_PORT:-4321}:4321"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    profiles:
      - dev

  web:
    build:
      context: .
      target: prod
    ports:
      - "${WEB_PORT:-8080}:80"
    networks:
      - edge
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${BRAND_SLUG:-brand}.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.${BRAND_SLUG:-brand}.entrypoints=websecure"
      - "traefik.http.routers.${BRAND_SLUG:-brand}.tls.certresolver=letsencrypt"
      - "traefik.http.services.${BRAND_SLUG:-brand}.loadbalancer.server.port=80"
    # Teto de recurso por marca — relevante em VPS com várias marcas atrás do
    # mesmo Traefik: sem isso, uma marca sob pico de tráfego pode disputar
    # CPU/memória com as outras que compartilham o host. Nginx estático
    # sozinho usa poucos MB; a folga é pra buffers/gzip/conexões simultâneas.
    # Calibrado pra site de conteúdo/marketing de tráfego baixo-médio — se
    # uma marca crescer além disso, é sinal de tirá-la da VPS compartilhada.
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
    profiles:
      - prod

# Rede compartilhada com o proxy reverso da VPS (ver traefik/). Precisa
# existir ANTES do primeiro `docker compose up`:
#   docker network create edge
# Rodar sem Traefik (só acesso direto via WEB_PORT) continua funcionando,
# mas essa rede externa precisa existir de qualquer forma — é criada uma
# única vez por VPS, não por marca.
networks:
  edge:
    external: true
