services:
  dev:
    build:
      context: .
      target: dev
    ports:
      - "${DEV_PORT:-4321}:4321"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    profiles:
      - dev

  web:
    build:
      context: .
      target: server
    # Injeta o .env desta instância como variáveis de ambiente do processo do
    # container (não é o mesmo mecanismo que a interpolação ${VAR} usada nas
    # labels abaixo, que é resolvida pelo próprio docker compose no host).
    # entrypoint.sh e o `npm run build` que ele dispara no boot leem essas
    # variáveis via process.env — nenhum .env entra na imagem (ver
    # .dockerignore).
    env_file:
      - .env
    # Sem `ports:` de propósito: atrás do Traefik, todo o tráfego público entra
    # pela :443 e é roteado por Host/path (ver labels abaixo) — a porta 80 do
    # nginx e a 4001 do backend do Tina NÃO devem ser publicadas no host, senão
    # ficam acessíveis direto no IP da VPS, contornando TLS, o redirect
    # HTTP→HTTPS e qualquer middleware (rate limit etc.). Pra debug local
    # pontual, exponha na loopback e nunca em 0.0.0.0, ex:
    #   ports:
    #     - "127.0.0.1:${TINA_PORT:-4001}:4001"
    networks:
      - edge
    volumes:
      # Conteúdo clonado da marca + build gerado + o "carimbo" do commit já
      # buildado — tudo que entrypoint.sh precisa sobreviver a um restart do
      # container (não só do processo) pra pular o build quando o conteúdo
      # não mudou. Montado DENTRO de /app (não em /data na raiz) de propósito
      # — ver o comentário sobre EXDEV em entrypoint.sh.
      - data:/app/data
    labels:
      - "traefik.enable=true"
      # Site estatico (Astro/nginx) — rota "pega tudo" pro dominio da marca.
      - "traefik.http.routers.${BRAND_SLUG:-brand}.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.${BRAND_SLUG:-brand}.entrypoints=websecure"
      - "traefik.http.routers.${BRAND_SLUG:-brand}.tls.certresolver=letsencrypt"
      - "traefik.http.routers.${BRAND_SLUG:-brand}.service=${BRAND_SLUG:-brand}-web"
      - "traefik.http.services.${BRAND_SLUG:-brand}-web.loadbalancer.server.port=8080"
      # Backend do Tina (GraphQL) — mesmo container, processo e porta
      # diferentes (ver entrypoint.sh). SO /api/tina aqui: o /admin (SPA
      # estatica do Tina) e gerado em tina:build dentro de astro/public/admin
      # e vai parar no dist do nginx (porta 80) igual qualquer outro asset
      # publico — nao existe em lugar nenhum do processo tina/server.mjs
      # (TinaNodeBackend so serve rotas sob options.basePath, "/api/tina/").
      # Incluir /admin aqui mandava esse caminho pro processo errado (4001),
      # que devolve "route not found" pra qualquer coisa fora de /api/tina.
      # Prioridade maior que a rota "pega tudo" acima, senão o Traefik nunca
      # chega a checar o PathPrefix.
      - "traefik.http.routers.${BRAND_SLUG:-brand}-tina.rule=Host(`${DOMAIN}`) && PathPrefix(`/api/tina`)"
      - "traefik.http.routers.${BRAND_SLUG:-brand}-tina.entrypoints=websecure"
      - "traefik.http.routers.${BRAND_SLUG:-brand}-tina.tls.certresolver=letsencrypt"
      - "traefik.http.routers.${BRAND_SLUG:-brand}-tina.priority=10"
      - "traefik.http.routers.${BRAND_SLUG:-brand}-tina.service=${BRAND_SLUG:-brand}-tina"
      - "traefik.http.services.${BRAND_SLUG:-brand}-tina.loadbalancer.server.port=4001"
      # Rate limit no endpoint público do Tina (/api/tina). É a única rota que
      # faz trabalho pesado por request (verificação scrypt no auth + GraphQL):
      # sem teto, um flood não autenticado força um scrypt por tentativa e pode
      # saturar CPU do container — mais crítico numa VPS onde várias marcas
      # dividem o host. average = req/s sustentado por IP de origem, burst =
      # pico curto tolerado antes do 429. Ajuste conforme o uso real do /admin.
      - "traefik.http.middlewares.${BRAND_SLUG:-brand}-tina-rl.ratelimit.average=5"
      - "traefik.http.middlewares.${BRAND_SLUG:-brand}-tina-rl.ratelimit.burst=10"
      - "traefik.http.routers.${BRAND_SLUG:-brand}-tina.middlewares=${BRAND_SLUG:-brand}-tina-rl"
    # Teto de recurso por marca — relevante em VPS com várias marcas atrás do
    # mesmo Traefik: sem isso, uma marca sob pico de tráfego (ou de build)
    # pode disputar CPU/memória com as outras que compartilham o host.
    # Diferente do modelo antigo (nginx puro servindo estático, ~poucos MB),
    # este container tem dois custos a somar: o pico do `astro build` no
    # boot/troca de conteúdo (medido ~420MB pra um conteúdo mínimo de
    # exemplo — conteúdo real de marca, com mais posts/imagens, pede mais) e
    # o backend do Tina em regime (medido ~100MB parado). Ajuste por marca
    # conforme o tamanho real do conteúdo dela.
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M
    profiles:
      - prod

volumes:
  data:

# Rede compartilhada com o proxy reverso da VPS (ver traefik/). Precisa
# existir ANTES do primeiro `docker compose up`:
#   docker network create edge
# Rodar sem Traefik (só acesso direto via WEB_PORT) continua funcionando,
# mas essa rede externa precisa existir de qualquer forma — é criada uma
# única vez por VPS, não por marca.
networks:
  edge:
    external: true
