# Referência de deploy pra uma instância de marca usando a imagem publicada
# (ghcr.io/brand-engine/brand-engine) — não o build local (ver docker-compose.yml
# deste template, usado só em dev). Copie este arquivo pro repositório da
# marca (junto com o `.env` dela) e rode a partir dele.
#
# Atualizar o template: troque a tag da imagem abaixo e rode
#   docker compose pull && docker compose up -d
# Ver README, "Atualizar o template" / "Rollback".
services:
  web:
    # Fixe numa tag concreta (versão ou "sha-<commit>") por marca — "latest"
    # move a marca a cada push pro main (ver ci.yml) e torna rollback
    # impossível sem editar isto primeiro. Publicadas em
    # https://github.com/brand-engine/pkgs/container/brand-engine. Nenhuma
    # tag semver (vX.Y.Z) foi publicada ainda (só acontece num push de tag
    # "vX.Y.Z" — ver ci.yml/README); a tag abaixo é um "sha-<commit>" real,
    # confirmado publicado. Não copie um número de versão do package.json ou
    # do Dockerfile achando que existe uma tag correspondente no GHCR sem
    # conferir antes (o pull falha com 403/"not found" indistinguível de um
    # erro de autenticação — ver README, "Autenticação no GHCR").
    image: ghcr.io/brand-engine/brand-engine:sha-70f38fb0bd1a71c46eda0901eb267a09e3361f91
    env_file:
      - .env
    # Sem `ports:` de propósito: atrás do Traefik, todo o tráfego público entra
    # pela :443 e é roteado por Host/path (labels abaixo) — publicar a porta 80
    # do nginx ou a 4001 do backend do Tina no host as deixa acessíveis direto
    # no IP da VPS, contornando TLS, o redirect HTTP→HTTPS e o rate limit. Pra
    # debug local pontual, exponha só na loopback, ex:
    #   ports:
    #     - "127.0.0.1:${TINA_PORT:-4001}:4001"
    networks:
      - edge
    volumes:
      - data:/app/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${BRAND_SLUG:-brand}.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.${BRAND_SLUG:-brand}.entrypoints=websecure"
      - "traefik.http.routers.${BRAND_SLUG:-brand}.tls.certresolver=letsencrypt"
      - "traefik.http.routers.${BRAND_SLUG:-brand}.service=${BRAND_SLUG:-brand}-web"
      - "traefik.http.services.${BRAND_SLUG:-brand}-web.loadbalancer.server.port=8080"
      # SO /api/tina: /admin (SPA estatica do Tina) vai parar no dist do
      # nginx (porta 80) igual qualquer outro asset publico, nao no processo
      # tina/server.mjs — ver comentario equivalente em docker-compose.yml.
      - "traefik.http.routers.${BRAND_SLUG:-brand}-tina.rule=Host(`${DOMAIN}`) && PathPrefix(`/api/tina`)"
      - "traefik.http.routers.${BRAND_SLUG:-brand}-tina.entrypoints=websecure"
      - "traefik.http.routers.${BRAND_SLUG:-brand}-tina.tls.certresolver=letsencrypt"
      - "traefik.http.routers.${BRAND_SLUG:-brand}-tina.priority=10"
      - "traefik.http.routers.${BRAND_SLUG:-brand}-tina.service=${BRAND_SLUG:-brand}-tina"
      - "traefik.http.services.${BRAND_SLUG:-brand}-tina.loadbalancer.server.port=4001"
      # Rate limit no endpoint público do Tina (/api/tina) — ver comentário
      # equivalente em docker-compose.yml. average = req/s sustentado por IP,
      # burst = pico curto antes do 429. Ajuste conforme o uso real do /admin.
      - "traefik.http.middlewares.${BRAND_SLUG:-brand}-tina-rl.ratelimit.average=5"
      - "traefik.http.middlewares.${BRAND_SLUG:-brand}-tina-rl.ratelimit.burst=10"
      - "traefik.http.routers.${BRAND_SLUG:-brand}-tina.middlewares=${BRAND_SLUG:-brand}-tina-rl"
    # Ver docker-compose.yml (deste template) pro raciocínio por trás destes
    # números — pico do `astro build` no boot + backend do Tina em regime.
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M
    restart: unless-stopped

volumes:
  data:

# Rede compartilhada com o Traefik da VPS — precisa existir antes do
# primeiro `docker compose up` (uma única vez por VPS, não por marca):
#   docker network create edge
networks:
  edge:
    external: true
