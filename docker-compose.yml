services:
  dev:
    build:
      context: .
      target: dev
    ports:
      - "${DEV_PORT:-4321}:4321"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    profiles:
      - dev

  web:
    build:
      context: .
      target: prod
    ports:
      - "${WEB_PORT:-8080}:80"
    profiles:
      - prod
